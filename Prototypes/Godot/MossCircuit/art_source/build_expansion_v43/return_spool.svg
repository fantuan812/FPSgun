<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" shape-rendering="crispEdges" role="img">
<title>Return Spool</title>
<desc>Wide spool flanges with four green recovery-line windings and a loose plug. New original geometric redraw from visual reference; not recovered source and not pixel-identical. Transparent 64 square, editable named groups and palette roles.</desc>
