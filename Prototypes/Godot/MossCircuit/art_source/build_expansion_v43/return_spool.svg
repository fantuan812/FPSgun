<g id="bottom-flange"><polygon points="14,45 46,45 51,50 51,53 46,58 14,58 9,53 9,50" fill="#202832" data-palette="ink"/><polygon points="12,49 18,47 42,47 48,49 48,53 43,55 18,55 12,53" fill="#d9d1ac" data-palette="cream"/><rect x="17" y="52" width="27" height="3" fill="#b87546" data-palette="copper"/><rect x="20" y="53" width="5" height="2" fill="#647540" data-palette="moss"/></g>
