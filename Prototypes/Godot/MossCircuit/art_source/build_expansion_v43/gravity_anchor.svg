<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" shape-rendering="crispEdges" role="img">
<title>Gravity Anchor</title>
<desc>Hanging ring, purple gravity core and three broad anchor claws. New original geometric redraw from visual reference; not recovered source and not pixel-identical. Transparent 64 square, editable named groups and palette roles.</desc>
<g id="hanging-loop"><polygon points="29,4 35,4 39,8 39,15 35,19 29,19 25,15 25,8" fill="#202832" data-palette="ink"/><polygon points="30,7 34,7 36,9 36,14 34,16 30,16 28,14 28,9" fill="#e8ac70" data-palette="copperlight"/><rect x="30" y="9" width="4" height="5" fill="#202832" data-palette="ink"/><rect x="29" y="16" width="6" height="7" fill="#b87546" data-palette="copper"/></g>
<g id="paired-anchor-claws"><polygon points="23,23 16,25 8,36 6,49 13,58 20,53 15,47 17,39 26,32" fill="#202832" data-palette="ink"/><polygon points="41,23 48,25 56,36 58,49 51,58 44,53 49,47 47,39 38,32" fill="#202832" data-palette="ink"/><polygon points="17,29 21,28 22,31 14,38 11,46 14,52 12,53 9,48 11,37" fill="#d9d1ac" data-palette="cream"/><polygon points="47,29 43,28 42,31 50,38 53,46 50,52 52,53 55,48 53,37" fill="#d9d1ac" data-palette="cream"/><polygon points="12,47 17,49 18,53 14,55 11,51" fill="#a467db" data-palette="purple"/><polygon points="52,47 47,49 46,53 50,55 53,51" fill="#a467db" data-palette="purple"/></g>
<g id="gravity-core"><polygon points="26,21 38,21 45,28 45,40 38,47 26,47 19,40 19,28" fill="#202832" data-palette="ink"/><polygon points="28,25 36,25 41,30 41,38 36,43 28,43 23,38 23,30" fill="#583773" data-palette="violetdark"/><polygon points="29,28 35,28 38,31 38,37 35,40 29,40 26,37 26,31" fill="#a467db" data-palette="purple"/><rect x="28" y="29" width="5" height="4" fill="#e0b8f5" data-palette="lavender"/></g>
<g id="center-anchor-spine"><polygon points="29,18 35,18 36,40 39,46 32,56 25,46 28,40" fill="#202832" data-palette="ink"/><rect x="30" y="21" width="4" height="20" fill="#637c80" data-palette="steel"/><rect x="27" y="23" width="10" height="4" fill="#b87546" data-palette="copper"/><rect x="27" y="37" width="10" height="4" fill="#b87546" data-palette="copper"/><polygon points="29,43 35,43 35,47 32,51 29,47" fill="#e8ac70" data-palette="copperlight"/></g>
<g id="moss-on-claws"><rect x="13" y="33" width="5" height="4" fill="#647540" data-palette="moss"/><rect x="46" y="33" width="5" height="4" fill="#647540" data-palette="moss"/><rect x="17" y="27" width="4" height="3" fill="#a2b65c" data-palette="mosslight"/></g>
</svg>
