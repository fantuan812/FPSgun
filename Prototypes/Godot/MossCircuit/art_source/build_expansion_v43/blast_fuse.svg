<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" shape-rendering="crispEdges" role="img">
<title>Blast Fuse</title>
<desc>Copper-banded canister and short curved fuse ending in a clear orange spark. New original geometric redraw from visual reference; not recovered source and not pixel-identical. Transparent 64 square, editable named groups and palette roles.</desc>
