<g id="violet-chamber"><polygon points="40,26 50,26 54,32 54,41 50,47 40,47 37,42 37,32" fill="#583773" data-palette="violetdark"/><polygon points="42,28 48,28 51,33 51,40 48,45 42,45 40,41 40,33" fill="#a467db" data-palette="purple"/><polygon points="44,29 47,29 45,34 49,37 44,44 42,42 45,37 41,34" fill="#e0b8f5" data-palette="lavender"/></g>
