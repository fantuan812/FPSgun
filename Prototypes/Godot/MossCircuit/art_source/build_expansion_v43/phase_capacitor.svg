<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" shape-rendering="crispEdges" role="img">
<title>Phase Capacitor</title>
<desc>Horizontal cyan and violet capacitor chambers joined by a dark bridge and a top phase arc. New original geometric redraw from visual reference; not recovered source and not pixel-identical. Transparent 64 square, editable named groups and palette roles.</desc>
<g id="phase-arc"><polygon points="16,16 21,11 28,14 34,9 42,13 48,12 51,17 48,20 44,17 41,18 35,14 29,19 22,16 19,20" fill="#583773" data-palette="violetdark"/><polygon points="18,16 22,13 28,16 34,12 41,15 47,14 49,17 46,17 41,17 35,14 29,18 22,15 19,18" fill="#e0b8f5" data-palette="lavender"/></g>
<g id="terminal-posts"><rect x="15" y="17" width="7" height="11" fill="#202832" data-palette="ink"/><rect x="17" y="18" width="3" height="8" fill="#e8ac70" data-palette="copperlight"/><rect x="43" y="17" width="7" height="11" fill="#202832" data-palette="ink"/><rect x="45" y="18" width="3" height="8" fill="#e8ac70" data-palette="copperlight"/></g>
<g id="horizontal-body-outline"><polygon points="7,27 15,22 49,22 57,27 61,34 60,43 53,50 13,50 5,44 3,35" fill="#202832" data-palette="ink"/><rect x="27" y="24" width="10" height="24" fill="#39434c" data-palette="shade"/><rect x="28" y="27" width="8" height="5" fill="#637c80" data-palette="steel"/><rect x="28" y="39" width="8" height="6" fill="#637c80" data-palette="steel"/></g>
